<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>igiteam.github.io - Repositories</title>

    <link rel="icon" href="https://github.com/igiteam.png" type="image/png">
    <link rel="apple-touch-icon" href="https://github.com/igiteam.png" sizes="180x180">
    <link rel="icon" type="image/png" href="https://github.com/igiteam.png" sizes="192x192">
    <link rel="icon" type="image/png" href="https://github.com/igiteam.png" sizes="512x512">
    <meta itemprop="name" content="igiteam.github.io - Repositories">
    <meta itemprop="image"
        content="https://opengraph.githubassets.com/f5af2a1baaa2cfcb3e75750272d03a432ccefe6bcaee8c93cfc515144aed259a/igiteam/igiteam.github.com">
    <meta property="og:title" content="igiteam.github.io - Repositories">
    <meta property="og:image"
        content="https://opengraph.githubassets.com/f5af2a1baaa2cfcb3e75750272d03a432ccefe6bcaee8c93cfc515144aed259a/igiteam/igiteam.github.com">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">
    <meta name="twitter:title" content="igiteam.github.io - Repositories">
    <meta name="twitter:image"
        content="https://opengraph.githubassets.com/f5af2a1baaa2cfcb3e75750272d03a432ccefe6bcaee8c93cfc515144aed259a/igiteam/igiteam.github.com">

    <meta itemprop="image"
        content="https://opengraph.githubassets.com/f5af2a1baaa2cfcb3e75750272d03a432ccefe6bcaee8c93cfc515144aed259a/igiteam/igiteam.github.com">

    <meta property="og:image"
        content="https://opengraph.githubassets.com/f5af2a1baaa2cfcb3e75750272d03a432ccefe6bcaee8c93cfc515144aed259a/igiteam/igiteam.github.com">

    <meta name="twitter:image"
        content="https://opengraph.githubassets.com/f5af2a1baaa2cfcb3e75750272d03a432ccefe6bcaee8c93cfc515144aed259a/igiteam/igiteam.github.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --github-bg: #ffffff;
            --github-text: #24292f;
            --github-text-secondary: #57606a;
            --github-border: #d0d7de;
            --github-primary: #0969da;
            --github-green: #1a7f37;
            --github-repo-bg: #ffffff;
            --github-hover: #f6f8fa;
            --github-shadow: rgba(140, 149, 159, 0.15);
        }

        body {
            background-color: var(--github-bg);
            color: var(--github-text);
            line-height: 1.5;
            padding: 24px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Repository Header */
        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--github-border);
        }

        .repo-header h1 {
            font-size: 32px;
            font-weight: 600;
            color: var(--github-text);
        }

        .repo-count {
            font-size: 14px;
            color: var(--github-text-secondary);
            background-color: var(--github-hover);
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        .repo-search {
            background-color: var(--github-bg);
            border: 1px solid var(--github-border);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--github-text);
            font-size: 14px;
            width: 300px;
            transition: all 0.2s;
            box-shadow: 0 1px 0 rgba(27, 31, 35, 0.04);
        }

        .repo-search:focus {
            outline: none;
            border-color: var(--github-primary);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--github-border);
        }

        .user-name {
            font-weight: 600;
            font-size: 18px;
        }

        /* Repository Grid */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Repository Item */
        .repo-item {
            padding: 24px;
            border: 1px solid var(--github-border);
            border-radius: 8px;
            background-color: var(--github-repo-bg);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 1px 3px var(--github-shadow);
        }

        .repo-item:hover {
            border-color: var(--github-primary);
            box-shadow: 0 3px 6px var(--github-shadow);
            transform: translateY(-2px);
        }

        .repo-title {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .repo-title a {
            color: var(--github-primary);
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            flex: 1;
        }

        .repo-title a:hover {
            text-decoration: underline;
        }

        .repo-visibility {
            border: 1px solid var(--github-border);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
            color: var(--github-text-secondary);
            text-transform: capitalize;
            font-weight: 500;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .repo-description {
            color: var(--github-text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 12px;
            color: var(--github-text-secondary);
            margin-top: auto;
        }

        .repo-language {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .language-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #f1e05a;
        }

        .repo-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .repo-stars,
        .repo-forks {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .repo-updated {
            font-size: 12px;
            color: var(--github-text-secondary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 32px;
            margin-top: 32px;
            border-top: 1px solid var(--github-border);
            color: var(--github-text-secondary);
            font-size: 14px;
        }

        .footer a {
            color: var(--github-primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Loading & Error States */
        .loading,
        .error {
            text-align: center;
            padding: 60px 20px;
            border-radius: 8px;
            background-color: var(--github-hover);
            border: 1px solid var(--github-border);
            grid-column: 1 / -1;
        }

        .loading i {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--github-primary);
        }

        .loading p {
            font-size: 16px;
            color: var(--github-text-secondary);
        }

        .error {
            color: #cf222e;
        }

        .error i {
            font-size: 32px;
            margin-bottom: 16px;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            border-radius: 8px;
            background-color: var(--github-hover);
            border: 1px solid var(--github-border);
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--github-text-secondary);
        }

        .no-results p {
            font-size: 16px;
            color: var(--github-text-secondary);
        }

        /* API Info */
        .api-info {
            font-size: 12px;
            color: var(--github-text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .api-info i {
            color: var(--github-green);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .repo-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .repo-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .repo-search {
                width: 100%;
            }

            .repo-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .repo-header h1 {
                font-size: 24px;
            }

            .repo-item {
                padding: 20px;
            }

            .repo-meta {
                flex-direction: column;
                gap: 8px;
            }

            .repo-stats {
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Repository Header -->
        <div class="repo-header">
            <div>
                <div class="user-info">
                    <img src="https://github.com/igiteam.png" alt="GitHub Avatar" class="user-avatar" id="userAvatar"
                        onerror="this.src='https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'">
                    <div>
                        <div class="user-name" id="userName">IGITeam</div>
                        <div class="repo-count" id="repoCount">Loading repositories...</div>
                    </div>
                </div>
                <div class="api-info">
                    <i class="fas fa-check-circle"></i>
                    <span>Live data from GitHub API</span>
                </div>
            </div>
            <input type="text" class="repo-search" placeholder="Find a repository..." id="repoSearch">
        </div>

        <!-- Repository Grid -->
        <div class="repo-grid" id="reposContainer">
            <div class="loading" id="loadingState">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading repositories from GitHub...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Showing repositories from <a href="https://github.com/igiteam" target="_blank"
                    id="githubLink">github.com/igiteam</a></p>
            <p>Updated in real-time via GitHub API</p>
        </div>
    </div>

    <script>
        // GitHub API configuration
        const GITHUB_USERNAME = 'igiteam';
        const GITHUB_API_URL = `https://api.github.com/users/${GITHUB_USERNAME}`;
        const REPOS_API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&direction=desc&per_page=100`;

        // Language color mapping from GitHub
        const languageColors = {
            "JavaScript": "#f1e05a",
            "Python": "#3572A5",
            "TypeScript": "#2b7489",
            "HTML": "#e34c26",
            "CSS": "#563d7c",
            "Java": "#b07219",
            "C++": "#f34b7d",
            "C": "#555555",
            "C#": "#178600",
            "PHP": "#4F5D95",
            "Ruby": "#701516",
            "Go": "#00ADD8",
            "Rust": "#dea584",
            "Swift": "#ffac45",
            "Kotlin": "#F18E33",
            "Dart": "#00B4AB",
            "Shell": "#89e051",
            "PowerShell": "#012456",
            "Vue": "#2c3e50",
            "React": "#61dafb",
            "Angular": "#dd0031",
            "Svelte": "#ff3e00",
            "TeX": "#3D6117",
            "Scala": "#c22d40",
            "R": "#198CE7",
            "Objective-C": "#438eff",
            "Perl": "#0298c3",
            "Lua": "#000080",
            "Haskell": "#5e5086",
            "Clojure": "#db5855",
            "Elixir": "#6e4a7e",
            "Erlang": "#B83998",
            "Julia": "#a270ba",
            "CoffeeScript": "#244776",
            "OCaml": "#3be133"
        };

        // Format date to relative time
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            if (diffInSeconds < 60) {
                return "just now";
            } else if (diffInSeconds < 3600) {
                const minutes = Math.floor(diffInSeconds / 60);
                return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 86400) {
                const hours = Math.floor(diffInSeconds / 3600);
                return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 604800) {
                const days = Math.floor(diffInSeconds / 86400);
                if (days === 1) return "yesterday";
                return `${days} days ago`;
            } else if (diffInSeconds < 2592000) {
                const weeks = Math.floor(diffInSeconds / 604800);
                return `${weeks} week${weeks > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 31536000) {
                const months = Math.floor(diffInSeconds / 2592000);
                return `${months} month${months > 1 ? 's' : ''} ago`;
            } else {
                const years = Math.floor(diffInSeconds / 31536000);
                return `${years} year${years > 1 ? 's' : ''} ago`;
            }
        }

        // Render repositories
        function renderRepositories(repositories, userData) {
            const container = document.getElementById('reposContainer');
            const repoCount = document.getElementById('repoCount');
            const userName = document.getElementById('userName');
            const githubLink = document.getElementById('githubLink');

            if (!repositories || repositories.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <p>No repositories found for ${GITHUB_USERNAME}.</p>
                    </div>
                `;
                repoCount.textContent = '0 repositories';
                return;
            }

            // Update user info
            if (userData) {
                userName.textContent = userData.name || userData.login;
                githubLink.href = userData.html_url;
                document.title = `${userData.login}'s Repositories`;
            }

            let html = '';

            repositories.forEach(repo => {
                const languageColor = languageColors[repo.language] || "#8b949e";
                const visibility = repo.private ? "private" : "public";

                html += `
                    <div class="repo-item">
                        <div class="repo-title">
                            <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                            <span class="repo-visibility">${visibility}</span>
                        </div>
                        <p class="repo-description">${repo.description || 'No description provided'}</p>
                        <div class="repo-meta">
                            ${repo.language ? `
                                <div class="repo-language">
                                    <span class="language-color" style="background-color: ${languageColor};"></span>
                                    <span>${repo.language}</span>
                                </div>
                            ` : ''}
                            <div class="repo-stats">
                                <div class="repo-stars">
                                    <i class="far fa-star"></i>
                                    <span>${repo.stargazers_count}</span>
                                </div>
                                <div class="repo-forks">
                                    <i class="fas fa-code-branch"></i>
                                    <span>${repo.forks_count}</span>
                                </div>
                            </div>
                            <div class="repo-updated">
                                <span>Updated ${formatDate(repo.updated_at)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            repoCount.textContent = `${repositories.length} repositories`;
        }

        // Search repositories
        function searchRepositories(repositories, query) {
            if (!query.trim()) {
                return repositories;
            }

            const searchTerms = query.toLowerCase().split(' ');
            return repositories.filter(repo => {
                const repoText = `
                    ${repo.name.toLowerCase()}
                    ${repo.description ? repo.description.toLowerCase() : ''}
                    ${repo.language ? repo.language.toLowerCase() : ''}
                    ${repo.topics ? repo.topics.join(' ').toLowerCase() : ''}
                `;

                return searchTerms.every(term => repoText.includes(term));
            });
        }

        // Fetch data from GitHub API
        async function fetchGitHubData() {
            try {
                // Show loading state
                document.getElementById('loadingState').innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Fetching data from GitHub API...</p>
                `;

                // Fetch user data and repositories in parallel
                const [userResponse, reposResponse] = await Promise.all([
                    fetch(GITHUB_API_URL),
                    fetch(REPOS_API_URL)
                ]);

                // Check for rate limiting
                const userRemaining = userResponse.headers.get('X-RateLimit-Remaining');
                const userLimit = userResponse.headers.get('X-RateLimit-Limit');

                if (userRemaining && parseInt(userRemaining) < 10) {
                    console.warn(`GitHub API rate limit: ${userRemaining}/${userLimit} remaining`);
                }

                if (!userResponse.ok) {
                    throw new Error(`GitHub API error: ${userResponse.status} ${userResponse.statusText}`);
                }

                if (!reposResponse.ok) {
                    throw new Error(`GitHub API error: ${reposResponse.status} ${reposResponse.statusText}`);
                }

                const userData = await userResponse.json();
                let reposData = await reposResponse.json();

                // If we have more than 100 repos, we might need to fetch additional pages
                // For now, we'll just use the first 100 (most recently updated)

                // Sort by stars (descending) to show popular repos first
                reposData.sort((a, b) => b.stargazers_count - a.stargazers_count);

                // Render the repositories
                renderRepositories(reposData, userData);

                // Store repos for searching
                window.allRepos = reposData;

                // Setup search functionality
                const searchInput = document.getElementById('repoSearch');
                searchInput.addEventListener('input', (e) => {
                    const filteredRepos = searchRepositories(window.allRepos, e.target.value);
                    renderRepositories(filteredRepos, userData);
                });

                // Focus on search input
                searchInput.focus();

            } catch (error) {
                console.error('Error fetching GitHub data:', error);

                // Show error state
                document.getElementById('reposContainer').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load repositories from GitHub API.</p>
                        <p style="font-size: 14px; margin-top: 8px;">${error.message}</p>
                        <p style="font-size: 14px; margin-top: 16px;">
                            Check the console for details or try refreshing the page.
                        </p>
                    </div>
                `;

                document.getElementById('repoCount').textContent = 'Error loading';

                // Fallback to sample data after 3 seconds
                setTimeout(() => {
                    loadSampleData();
                }, 3000);
            }
        }

        // Fallback sample data
        function loadSampleData() {
            const sampleRepos = [
                {
                    name: "igiteam.github.io",
                    description: "GitHub Pages site for IGITeam projects",
                    language: "HTML",
                    stargazers_count: 0,
                    forks_count: 0,
                    updated_at: new Date().toISOString(),
                    private: false,
                    html_url: "https://github.com/igiteam/igiteam.github.io"
                },
                {
                    name: "sample-project",
                    description: "A sample project demonstrating GitHub API integration",
                    language: "JavaScript",
                    stargazers_count: 5,
                    forks_count: 2,
                    updated_at: new Date(Date.now() - 86400000).toISOString(), // Yesterday
                    private: false,
                    html_url: "https://github.com/igiteam"
                }
            ];

            const userData = {
                name: "IGITeam",
                login: "igiteam",
                html_url: "https://github.com/igiteam"
            };

            renderRepositories(sampleRepos, userData);
            window.allRepos = sampleRepos;

            // Update API info to show fallback
            document.querySelector('.api-info').innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color: #cf222e;"></i>
                <span>Using sample data (GitHub API unavailable)</span>
            `;

            // Setup search for sample data
            const searchInput = document.getElementById('repoSearch');
            searchInput.addEventListener('input', (e) => {
                const filteredRepos = searchRepositories(window.allRepos, e.target.value);
                renderRepositories(filteredRepos, userData);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            fetchGitHubData();
        });
    </script>
</body>

</html>
