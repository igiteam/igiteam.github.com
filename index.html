    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --github-bg: #ffffff;
            --github-text: #24292f;
            --github-text-secondary: #57606a;
            --github-border: #d0d7de;
            --github-primary: #0969da;
            --github-green: #1a7f37;
            --github-repo-bg: #ffffff;
            --github-hover: #f6f8fa;
            --github-shadow: rgba(140, 149, 159, 0.15);
        }

        body {
            background-color: var(--github-bg);
            color: var(--github-text);
            line-height: 1.5;
            padding: 24px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Repository Header */
        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--github-border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .repo-header h1 {
            font-size: 32px;
            font-weight: 600;
            color: var(--github-text);
        }

        .repo-count {
            font-size: 14px;
            color: var(--github-text-secondary);
            background-color: var(--github-hover);
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: nowrap;
            /* Changed from wrap to nowrap */
        }

        .repo-search {
            background-color: var(--github-bg);
            border: 1px solid var(--github-border);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--github-text);
            font-size: 14px;
            width: 300px;
            transition: all 0.2s;
            box-shadow: 0 1px 0 rgba(27, 31, 35, 0.04);
            flex-shrink: 0;
            /* Prevent search from shrinking */
        }

        .repo-search:focus {
            outline: none;
            border-color: var(--github-primary);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .view-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            /* Take remaining space */
            justify-content: flex-end;
            /* Push to the right */
        }

        .sort-buttons {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
            /* Prevent sorting buttons from shrinking */
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
            /* Prevent view toggle from shrinking */
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--github-border);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--github-text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            background-color: var(--github-bg);
            white-space: nowrap;
            /* Prevent text wrapping */
        }

        /* Optional: Hide text on smaller screens and show only icons */
        @media (max-width: 900px) {
            .sort-text {
                display: none;
                /* Hide text on smaller screens */
            }

            .btn-icon {
                padding: 8px;
                /* Adjust padding when only icons show */
            }
        }

        /* Adjust for very small screens */
        @media (max-width: 700px) {
            .search-container {
                flex-wrap: wrap;
                /* Allow wrapping only on very small screens */
            }

            .repo-search {
                width: 100%;
                /* Full width on mobile */
            }

            .view-controls {
                width: 100%;
                justify-content: space-between;
            }
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--github-border);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--github-text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            background-color: var(--github-bg);
        }

        .btn-icon:hover {
            background-color: var(--github-hover);
            border-color: var(--github-primary);
            color: var(--github-primary);
        }

        .btn-icon.active {
            background-color: var(--github-primary);
            border-color: var(--github-primary);
            color: white;
        }

        .btn-icon i {
            font-size: 14px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .user-details {
            display: flex;
            flex-direction: row;
            /* Changed from column to row */
            align-items: center;
            /* Align items vertically */
            gap: 8px;
            /* Space between name and count */
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--github-border);
            flex-shrink: 0;
            /* Prevents avatar from shrinking */
        }

        .user-name {
            font-weight: 600;
            font-size: 18px;
            line-height: 1.2;
            /* Tighter line height */
        }

        .repo-count {
            font-size: 14px;
            color: var(--github-text-secondary);
            background-color: var(--github-hover);
            padding: 2px 12px;
            /* Slightly adjusted padding */
            border-radius: 12px;
            display: inline-block;
            /* Makes it fit content width */
            align-self: flex-start;
            /* Aligns to left instead of stretching */
        }

        /* Repository Grid */
        .repo-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .repo-grid.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        }

        .repo-grid.list-view {
            grid-template-columns: 1fr;
        }

        /* Repository Item - Grid View */
        .repo-grid.grid-view .repo-item {
            padding: 24px;
            flex-direction: column;
        }

        .repo-grid.grid-view .repo-meta {
            flex-wrap: wrap;
        }

        /* Repository Item - List View */
        .repo-grid.list-view .repo-item {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: minmax(200px, auto) 1fr auto;
            align-items: center;
            gap: 24px;
        }

        .repo-grid.list-view .repo-title {
            margin-bottom: 0;
            width: 250px;
        }

        .repo-grid.list-view .repo-description {
            margin-bottom: 0;
            -webkit-line-clamp: 2;
        }

        .repo-grid.list-view .repo-meta {
            margin-top: 0;
            flex-wrap: nowrap;
            justify-content: flex-end;
            min-width: 300px;
        }

        @media (max-width: 900px) {
            .repo-grid.list-view .repo-item {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .repo-grid.list-view .repo-title {
                width: auto;
            }

            .repo-grid.list-view .repo-meta {
                justify-content: flex-start;
            }
        }

        /* Repository Item */
        .repo-item {
            border: 1px solid var(--github-border);
            border-radius: 8px;
            background-color: var(--github-repo-bg);
            transition: all 0.2s;
            display: flex;
            height: 100%;
            box-shadow: 0 1px 3px var(--github-shadow);
        }

        .repo-item:hover {
            border-color: var(--github-primary);
            box-shadow: 0 3px 6px var(--github-shadow);
            transform: translateY(-2px);
        }

        .repo-title {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .repo-title a {
            color: var(--github-primary);
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            flex: 1;
            word-break: break-all;
            /* Breaks anywhere */
        }

        .repo-title a:hover {
            text-decoration: underline;
        }

        .repo-visibility {
            border: 1px solid var(--github-border);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
            color: var(--github-text-secondary);
            text-transform: capitalize;
            font-weight: 500;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .repo-description {
            color: var(--github-text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 12px;
            color: var(--github-text-secondary);
            margin-top: auto;
            align-items: center;
        }

        .repo-language {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .language-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #f1e05a;
        }

        .repo-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .repo-stars,
        .repo-forks {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .repo-updated {
            font-size: 12px;
            color: var(--github-text-secondary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 32px;
            margin-top: 32px;
            border-top: 1px solid var(--github-border);
            color: var(--github-text-secondary);
            font-size: 14px;
        }

        .footer a {
            color: var(--github-primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Loading & Error States */
        .loading,
        .error {
            text-align: center;
            padding: 60px 20px;
            border-radius: 8px;
            background-color: var(--github-hover);
            border: 1px solid var(--github-border);
            grid-column: 1 / -1;
        }

        .loading i {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--github-primary);
        }

        .loading p {
            font-size: 16px;
            color: var(--github-text-secondary);
        }

        .error {
            color: #cf222e;
        }

        .error i {
            font-size: 32px;
            margin-bottom: 16px;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            border-radius: 8px;
            background-color: var(--github-hover);
            border: 1px solid var(--github-border);
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--github-text-secondary);
        }

        .no-results p {
            font-size: 16px;
            color: var(--github-text-secondary);
        }

        /* API Info */
        .api-info {
            font-size: 12px;
            color: var(--github-text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .api-info i {
            color: var(--github-green);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .repo-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-container {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }

            .repo-search {
                width: 100%;
            }

            .view-controls {
                justify-content: space-between;
            }

            .repo-grid.grid-view {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

        <div class="footer">
            <p>Showing repositories from <a href="https://github.com/igiteam" target="_blank"
                    id="githubLink">github.com/igiteam</a></p>

    <script>
        // GitHub API configuration
        const GITHUB_USERNAME = 'igiteam';
        const GITHUB_API_URL = `https://api.github.com/users/${GITHUB_USERNAME}`;
        const REPOS_API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&direction=desc&per_page=100`;

        // Language color mapping from GitHub
        const languageColors = {
            "JavaScript": "#f1e05a",
            "Python": "#3572A5",
            "TypeScript": "#2b7489",
            "HTML": "#e34c26",
            "CSS": "#563d7c",
            "Java": "#b07219",
            "C++": "#f34b7d",
            "C": "#555555",
            "C#": "#178600",
            "PHP": "#4F5D95",
            "Ruby": "#701516",
            "Go": "#00ADD8",
            "Rust": "#dea584",
            "Swift": "#ffac45",
            "Kotlin": "#F18E33",
            "Dart": "#00B4AB",
            "Shell": "#89e051",
            "PowerShell": "#012456",
            "Vue": "#2c3e50",
            "React": "#61dafb",
            "Angular": "#dd0031",
            "Svelte": "#ff3e00",
            "TeX": "#3D6117",
            "Scala": "#c22d40",
            "R": "#198CE7",
            "Objective-C": "#438eff",
            "Perl": "#0298c3",
            "Lua": "#000080",
            "Haskell": "#5e5086",
            "Clojure": "#db5855",
            "Elixir": "#6e4a7e",
            "Erlang": "#B83998",
            "Julia": "#a270ba",
            "CoffeeScript": "#244776",
            "OCaml": "#3be133"
        };

        // State management
        let currentRepos = [];
        let currentUserData = null;
        let currentSort = localStorage.getItem('repoSort') || 'time';
        let currentView = localStorage.getItem('repoView') || 'grid';
        let currentSearchQuery = '';

        // Format date to relative time
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            if (diffInSeconds < 60) {
                return "just now";
            } else if (diffInSeconds < 3600) {
                const minutes = Math.floor(diffInSeconds / 60);
                return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 86400) {
                const hours = Math.floor(diffInSeconds / 3600);
                return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 604800) {
                const days = Math.floor(diffInSeconds / 86400);
                if (days === 1) return "yesterday";
                return `${days} days ago`;
            } else if (diffInSeconds < 2592000) {
                const weeks = Math.floor(diffInSeconds / 604800);
                return `${weeks} week${weeks > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 31536000) {
                const months = Math.floor(diffInSeconds / 2592000);
                return `${months} month${months > 1 ? 's' : ''} ago`;
            } else {
                const years = Math.floor(diffInSeconds / 31536000);
                return `${years} year${years > 1 ? 's' : ''} ago`;
            }
        }

        // Sort repositories
        function sortRepositories(repositories, sortType) {
            const repos = [...repositories];

            switch (sortType) {
                case 'stars':
                    return repos.sort((a, b) => b.stargazers_count - a.stargazers_count);
                case 'name':
                    return repos.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
                case 'time':
                default:
                    return repos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            }
        }

        // Search repositories
        function searchRepositories(repositories, query) {
            if (!query.trim()) {
                return repositories;
            }

            const searchTerms = query.toLowerCase().split(' ');
            return repositories.filter(repo => {
                const repoText = `
                    ${repo.name.toLowerCase()}
                    ${repo.description ? repo.description.toLowerCase() : ''}
                    ${repo.language ? repo.language.toLowerCase() : ''}
                    ${repo.topics ? repo.topics.join(' ').toLowerCase() : ''}
                `;

                return searchTerms.every(term => repoText.includes(term));
            });
        }

        // Update view buttons active state
        function updateViewButtons() {
            const gridBtn = document.getElementById('gridViewBtn');
            const listBtn = document.getElementById('listViewBtn');

            gridBtn.classList.toggle('active', currentView === 'grid');
            listBtn.classList.toggle('active', currentView === 'list');
        }

        // Update sort buttons active state
        function updateSortButtons() {
            const sortTimeBtn = document.getElementById('sortTimeBtn');
            const sortStarsBtn = document.getElementById('sortStarsBtn');
            const sortNameBtn = document.getElementById('sortNameBtn');

            sortTimeBtn.classList.toggle('active', currentSort === 'time');
            sortStarsBtn.classList.toggle('active', currentSort === 'stars');
            sortNameBtn.classList.toggle('active', currentSort === 'name');
        }

        // Apply view to container
        function applyView() {
            const container = document.getElementById('reposContainer');
            container.classList.toggle('grid-view', currentView === 'grid');
            container.classList.toggle('list-view', currentView === 'list');
        }

        // Render repositories
        function renderRepositories(repositories, userData) {
            const container = document.getElementById('reposContainer');
            const repoCount = document.getElementById('repoCount');
            const userName = document.getElementById('userName');
            const githubLink = document.getElementById('githubLink');

            if (!repositories || repositories.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <p>No repositories found for ${GITHUB_USERNAME}.</p>
                    </div>
                `;
                repoCount.textContent = '0 repositories';
                return;
            }

            // Update user info
            if (userData) {
                userName.textContent = userData.name || userData.login;
                githubLink.href = userData.html_url;
                document.title = `${userData.login}'s Repositories`;
            }

            let html = '';

            repositories.forEach(repo => {
                const languageColor = languageColors[repo.language] || "#8b949e";
                const visibility = repo.private ? "private" : "public";

                html += `
                    <div class="repo-item">
                        <div class="repo-title">
                            <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                            <span class="repo-visibility">${visibility}</span>
                        </div>
                        <p class="repo-description">${repo.description || 'No description provided'}</p>
                        <div class="repo-meta">
                            ${repo.language ? `
                                <div class="repo-language">
                                    <span class="language-color" style="background-color: ${languageColor};"></span>
                                    <span>${repo.language}</span>
                                </div>
                            ` : ''}
                            <div class="repo-stats">
                                <div class="repo-stars">
                                    <i class="far fa-star"></i>
                                    <span>${repo.stargazers_count}</span>
                                </div>
                                <div class="repo-forks">
                                    <i class="fas fa-code-branch"></i>
                                    <span>${repo.forks_count}</span>
                                </div>
                            </div>
                            <div class="repo-updated">
                                <span>Updated ${formatDate(repo.updated_at)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            repoCount.textContent = `${repositories.length} repositories`;

            // Apply current view
            applyView();
        }

        // Update and render with current state
        function updateAndRender() {
            if (!currentRepos.length) return;

            // Apply search
            let filteredRepos = searchRepositories(currentRepos, currentSearchQuery);

            // Apply sort
            filteredRepos = sortRepositories(filteredRepos, currentSort);

            // Render
            renderRepositories(filteredRepos, currentUserData);

            // Update button states
            updateSortButtons();
        }

        // Setup event listeners for controls
        function setupControls() {
            const searchInput = document.getElementById('repoSearch');
            const sortTimeBtn = document.getElementById('sortTimeBtn');
            const sortStarsBtn = document.getElementById('sortStarsBtn');
            const sortNameBtn = document.getElementById('sortNameBtn');
            const gridViewBtn = document.getElementById('gridViewBtn');
            const listViewBtn = document.getElementById('listViewBtn');

            // Search
            searchInput.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                updateAndRender();
            });

            // Sort buttons
            sortTimeBtn.addEventListener('click', () => {
                currentSort = 'time';
                localStorage.setItem('repoSort', 'time');
                updateAndRender();
            });

            sortStarsBtn.addEventListener('click', () => {
                currentSort = 'stars';
                localStorage.setItem('repoSort', 'stars');
                updateAndRender();
            });

            sortNameBtn.addEventListener('click', () => {
                currentSort = 'name';
                localStorage.setItem('repoSort', 'name');
                updateAndRender();
            });

            // View buttons
            gridViewBtn.addEventListener('click', () => {
                currentView = 'grid';
                localStorage.setItem('repoView', 'grid');
                updateViewButtons();
                applyView();
            });

            listViewBtn.addEventListener('click', () => {
                currentView = 'list';
                localStorage.setItem('repoView', 'list');
                updateViewButtons();
                applyView();
            });

            // Set initial button states
            updateViewButtons();
            updateSortButtons();
            applyView();
        }

        // Fetch data from GitHub API
        async function fetchGitHubData() {
            try {
                // Show loading state
                document.getElementById('loadingState').innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Fetching data from GitHub API...</p>
                `;

                // Fetch user data and repositories in parallel
                const [userResponse, reposResponse] = await Promise.all([
                    fetch(GITHUB_API_URL),
                    fetch(REPOS_API_URL)
                ]);

                // Check for rate limiting
                const userRemaining = userResponse.headers.get('X-RateLimit-Remaining');
                const userLimit = userResponse.headers.get('X-RateLimit-Limit');

                if (userRemaining && parseInt(userRemaining) < 10) {
                    console.warn(`GitHub API rate limit: ${userRemaining}/${userLimit} remaining`);
                }

                if (!userResponse.ok) {
                    throw new Error(`GitHub API error: ${userResponse.status} ${userResponse.statusText}`);
                }

                if (!reposResponse.ok) {
                    throw new Error(`GitHub API error: ${reposResponse.status} ${reposResponse.statusText}`);
                }

                const userData = await userResponse.json();
                let reposData = await reposResponse.json();

                // Store data
                currentRepos = reposData;
                currentUserData = userData;

                // Apply initial sort from localStorage
                currentRepos = sortRepositories(currentRepos, currentSort);

                // Render the repositories
                renderRepositories(currentRepos, userData);

                // Setup controls
                setupControls();

                // Focus on search input
                document.getElementById('repoSearch').focus();

            } catch (error) {
                console.error('Error fetching GitHub data:', error);

                // Show error state
                document.getElementById('reposContainer').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load repositories from GitHub API.</p>
                        <p style="font-size: 14px; margin-top: 8px;">${error.message}</p>
                        <p style="font-size: 14px; margin-top: 16px;">
                            Check the console for details or try refreshing the page.
                        </p>
                    </div>
                `;

                document.getElementById('repoCount').textContent = 'Error loading';

                // Fallback to sample data after 3 seconds
                setTimeout(() => {
                    loadSampleData();
                }, 3000);
            }
        }

        // Fallback sample data
        function loadSampleData() {
            const sampleRepos = [
                {
                    name: "igiteam.github.io",
                    description: "GitHub Pages site for IGITeam projects",
                    language: "HTML",
                    stargazers_count: 0,
                    forks_count: 0,
                    updated_at: new Date().toISOString(),
                    private: false,
                    html_url: "https://github.com/igiteam/igiteam.github.io"
                },
                {
                    name: "sample-project",
                    description: "A sample project demonstrating GitHub API integration",
                    language: "JavaScript",
                    stargazers_count: 5,
                    forks_count: 2,
                    updated_at: new Date(Date.now() - 86400000).toISOString(), // Yesterday
                    private: false,
                    html_url: "https://github.com/igiteam"
                },
                {
                    name: "awesome-tool",
                    description: "An awesome tool for developers",
                    language: "Python",
                    stargazers_count: 15,
                    forks_count: 3,
                    updated_at: new Date(Date.now() - 172800000).toISOString(), // 2 days ago
                    private: false,
                    html_url: "https://github.com/igiteam"
                }
            ];

            currentRepos = sortRepositories(sampleRepos, currentSort);
            currentUserData = {
                name: "IGITeam",
                login: "igiteam",
                html_url: "https://github.com/igiteam"
            };

            renderRepositories(currentRepos, currentUserData);
            setupControls();

            // Update API info to show fallback
            document.querySelector('.api-info').innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color: #cf222e;"></i>
                <span>Using sample data (GitHub API unavailable)</span>
            `;
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            fetchGitHubData();
        });
    </script>
</body>
